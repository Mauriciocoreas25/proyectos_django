<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercial - {% block titulo %}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-200 text-slate-800">
    <div class="mx-auto w-full max-w-7xl px-4">
        <header>
            <nav class="flex items-center gap-x-8 py-3 border-b border-gray-300">
                <a href="{% url 'home' %}" class="text-2xl font-bold text-blue-600">
                    Comercial
                </a>
                <div class="flex items-center gap-6">
                    <a href="{% url 'list_categoria' %}" class="text-base font-medium text-gray-700 transition-colors hover:text-blue-600">
                        Categorías
                    </a>
                    <a href="{% url 'list_producto' %}" class="text-base font-medium text-gray-700 transition-colors hover:text-blue-600">
                        Productos
                    </a>
                    <a href="{% url 'list_tipo_pago' %}" class="text-base font-medium text-gray-700 transition-colors hover:text-blue-600">
                        Tipos de Pago
                    </a>
                    <a href="{% url 'list_cliente' %}" class="text-base font-medium text-gray-700 transition-colors hover:text-blue-600">
                        Clientes
                    </a>
                    <a href="{% url 'list_rol' %}" class="text-base font-medium text-gray-700 transition-colors hover:text-blue-600">
                        Roles
                    </a>
                </div>
                <form method="post" action="{% url 'logout' %}" class="ml-auto">
                    {% csrf_token %}
                    <button type="submit" class="ml-auto text-base font-medium text-gray-500 transition-colors hover:text-blue-600 sm:text-lg cursor-pointer">
                        Cerrar sesión
                    </button>
                </form>
            </nav>
        </header>

        <main class="w-full py-4 sm:py-6">
            {% block contenido %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
